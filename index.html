<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Выбей номер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --asphalt:#1f2226; --steel:#2b2f34; --steel-hi:#363b41; --line:#42474e;
  --text:#ecebe5; --muted:#9ca2a9; --blue:#2a5cc0; --blue-hi:#4b7fe6;
  --plate:#f6f5ef; --ink:#14171a;
  --tier:#8d949b;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--asphalt);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;
  padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 20px 6px;gap:12px}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.stats{display:flex;gap:18px;text-align:right;align-items:flex-end}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sound{background:none;border:0;font-size:20px;padding:2px 4px;line-height:1}

.tabs{display:flex;margin:8px 20px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 0;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{color:var(--text);border-color:var(--blue-hi)}

main{flex:1;overflow-y:auto;padding:16px 20px 24px}

/* ---------- plate ---------- */
.plate{
  --w:min(calc(100vw - 72px),400px);
  --h:calc(var(--w) / 4.64);
  position:relative;width:var(--w);height:var(--h);
  background:var(--plate);color:var(--ink);
  border-radius:calc(var(--h)*.09);padding:calc(var(--h)*.05);
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.4);
  font-family:"HelveticaNeue-CondensedBold","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  font-weight:700;
}
.plate-in{height:100%;display:flex;border:calc(var(--h)*.035) solid var(--ink);border-radius:calc(var(--h)*.06)}
.main{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--h)*.03)}
.c{display:inline-block;text-align:center;font-size:calc(var(--h)*.82);line-height:1;width:.56em;opacity:0;text-shadow:0 .02em 0 rgba(255,255,255,.7)}
.c.on,.c.hit{opacity:1}
.c.hit{animation:hit .24s cubic-bezier(.2,.9,.3,1.15)}
.gap{width:calc(var(--h)*.1)}
.reg{width:22%;border-left:calc(var(--h)*.035) solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--h)*.05) 0 calc(var(--h)*.06)}
.reg .c{width:auto;font-size:calc(var(--h)*.62)}
.reg .c.r3{font-size:calc(var(--h)*.47)}
.rus{display:flex;align-items:center;gap:calc(var(--h)*.05);font-size:calc(var(--h)*.2);line-height:1}
.flag{display:block;width:calc(var(--h)*.26);height:calc(var(--h)*.17);background:linear-gradient(#fff 0 33.3%,#1c4fa0 0 66.6%,#d52b1e 0);outline:1px solid rgba(0,0,0,.35)}
.plate.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1)}
.plate.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 70%);animation:flash .2s forwards}

@keyframes hit{
  0%{opacity:0;transform:scale(1.9) translateY(-14%);filter:blur(3px)}
  55%{opacity:1;transform:scale(.93);filter:blur(0)}
  100%{transform:scale(1)}
}
@keyframes enter{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@keyframes shake{25%{transform:translate(2px,3px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,-1px)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(18);opacity:0}}

/* ---------- press bed ---------- */
.bed{
  position:relative;border-radius:14px;padding:34px 16px;display:grid;place-items:center;overflow:hidden;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px),
    linear-gradient(180deg,#34393f,#272b30);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 -18px 30px rgba(0,0,0,.25);
}
.bed.shake{animation:shake .14s}
.bed .plate{transition:box-shadow .3s}
.bed.done .plate{box-shadow:0 0 0 3px var(--tier),0 0 44px -2px var(--tier),0 6px 0 rgba(0,0,0,.35)}
.bed.done::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--tier);pointer-events:none;animation:ring .7s ease-out forwards}

/* ---------- result ---------- */
.hint{margin-top:20px;color:var(--muted);font-size:15px}
.result{margin-top:20px}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--tier);border:1px solid var(--tier);background:rgba(255,255,255,.06)}
@supports (color:color-mix(in srgb,red,blue)){
  .chip{background:color-mix(in srgb,var(--tier) 20%,transparent)}
}
.price{margin-top:8px;font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tags{list-style:none;padding:0;margin-top:10px}
.tags li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.tags b{white-space:nowrap;font-variant-numeric:tabular-nums}
.tags .m b{color:var(--tier)}

/* ---------- bottom bar ---------- */
.bar{display:flex;gap:10px;padding:12px 20px calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--asphalt) 30%)}
.btn{border:0;border-radius:14px;padding:16px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 4px 0 #1b3f8a;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3f8a}
.btn.primary{flex:1;font-size:18px}
.btn.ghost{background:var(--steel-hi);box-shadow:0 4px 0 #23272b}
.btn.ghost:active{box-shadow:0 1px 0 #23272b}
.btn:disabled{opacity:.6;pointer-events:none}

/* ---------- garage ---------- */
.empty{color:var(--muted);padding:24px 0}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:14px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.row .plate{--w:168px;flex:none;outline:2px solid var(--tier);outline-offset:3px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.row .c{opacity:1}
.row b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.row small{color:var(--tier);font-weight:700}
.clear{margin-top:16px;background:none;border:0;color:var(--muted);font-size:14px;padding:8px 0;text-decoration:underline}

@media (prefers-reduced-motion:reduce){
  .c.hit,.plate.enter,.bed.shake,.plate.flash::after,.bed.done::after{animation:none}
}
</style>
</head>
<body>

<header>
  <h1>Выбей номер</h1>
  <div class="stats">
    <div class="stat"><b id="stCount">0</b><span>выбито</span></div>
    <div class="stat"><b id="stBest">0&nbsp;₽</b><span>рекорд</span></div>
    <button class="sound" id="soundBtn" aria-label="Звук включён" title="Звук">🔊</button>
  </div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabStamp" aria-selected="true">Пресс</button>
  <button class="tab" role="tab" id="tabGarage" aria-selected="false">Гараж <span id="garageN"></span></button>
</div>

<main id="viewStamp">
  <div class="bed" id="bed"><div id="slot"></div></div>
  <p class="hint" id="hint">Нажми кнопку: пресс выбьет номер, а мы оценим серию, цифры и регион.</p>
  <section class="result" id="result" hidden>
    <span class="chip" id="tierChip"></span>
    <div class="price" id="price"></div>
    <ul class="tags" id="tags"></ul>
  </section>
</main>

<main id="viewGarage" hidden>
  <div id="garageList"></div>
  <button class="clear" id="clearBtn" hidden>Очистить гараж</button>
</main>

<div class="bar" id="bar">
  <button class="btn ghost" id="shareBtn" hidden>Поделиться</button>
  <button class="btn primary" id="stampBtn">Выбить номер</button>
</div>

<script>
(() => {
'use strict';

const BOT_LINK = 'https://t.me/YOUR_BOT_USERNAME'; // <-- ссылка на твоего бота

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#1f2226'); tg.setBackgroundColor('#1f2226');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}

// ==== LOGIC START ====================================================
const LETTERS = 'АВЕКМНОРСТУХ'.split('');   // буквы, разрешённые на российских номерах
const BASE = 1500;

const REGION_GROUPS = [
  { name:'Москва', mult:2.2, codes:{'77':10,'99':3,'97':2,'177':5,'197':3,'199':3,'797':.7,'799':.5} },
  { name:'Москва, престижный регион', mult:4, codes:{'777':1.5} },
  { name:'Санкт-Петербург', mult:1.6, codes:{'78':5,'98':2,'178':3,'198':.5} },
  { name:'Московская область', mult:1.4, codes:{'50':4,'90':3,'150':3,'190':3,'750':1,'790':1} },
  { name:'', mult:1, codes:Object.fromEntries((
    '01 02 102 702 03 103 04 05 06 07 08 09 10 11 12 13 113 14 15 16 116 716 17 18 19 21 121 22 122 23 93 123 ' +
    '24 84 88 124 25 125 26 126 27 28 29 30 31 32 33 34 134 35 36 136 37 38 85 138 39 91 40 41 82 42 142 43 44 ' +
    '45 46 47 147 48 49 51 52 152 53 54 154 55 155 56 57 58 59 81 159 60 61 161 761 62 63 163 763 64 164 65 66 ' +
    '96 196 67 68 69 70 71 72 172 73 173 74 174 774 75 80 76 176 86 186 87 89 92 95'
  ).split(' ').map(c => [c, 1])) }
];
const REGION_MAP = {}, REGION_POOL = [];
let poolTotal = 0;
for (const g of REGION_GROUPS) for (const [code, w] of Object.entries(g.codes)) {
  REGION_MAP[code] = g; poolTotal += w; REGION_POOL.push([code, poolTotal]);
}

const TRIPLE_L = {'А':120000,'О':110000,'Х':90000,'М':90000,'К':90000,'Р':80000,'Е':80000,'В':70000,'С':70000,'Т':70000,'Н':60000,'У':60000};
const WORDS = {
  'ВОР':260000,'ЕКХ':300000,'АМР':220000,'ААА':100000,'ХАМ':70000,'МАМ':50000,'КОТ':60000,'ТОР':80000,
  'ТУТ':40000,'СОС':60000,'МОС':50000,'НОС':30000,'РОС':50000,'РУС':100000,'ТНТ':70000,'МКС':50000,
  'ММА':60000,'КВН':90000,'ОСА':20000
};
const TRIPLE_D = {'7':450000,'8':330000,'9':300000,'1':220000,'5':150000,'3':140000,'6':120000,'2':110000,'4':90000};
const SPECIAL_D = {
  '001':['Номер №1',380000], '007':['«Агент 007»',330000], '100':['Сотка',90000],
  '123':['Цифры по порядку 123',120000], '789':['Цифры по порядку 789',90000],
  '112':['Служба спасения 112',25000], '911':['Номер 911',20000], '404':['Ошибка 404',30000]
};

const TIERS = [
  { id:'common',    name:'Обычный',     min:0,       color:'#8d949b' },
  { id:'uncommon',  name:'Необычный',   min:8000,    color:'#4fae6e' },
  { id:'rare',      name:'Редкий',      min:40000,   color:'#3d8bfd' },
  { id:'epic',      name:'Эпический',   min:200000,  color:'#a35be8' },
  { id:'legendary', name:'Легендарный', min:1000000, color:'#f2b134' },
  { id:'mythic',    name:'Мифический',  min:5000000, color:'#ff5a4d' }
];

const rnd = n => Math.floor(Math.random() * n);

function pickRegion() {
  const x = Math.random() * poolTotal;
  for (const [code, cum] of REGION_POOL) if (x < cum) return code;
  return '77';
}
function randomPlate() {
  return {
    l: LETTERS[rnd(12)] + LETTERS[rnd(12)] + LETTERS[rnd(12)],
    d: String(1 + rnd(999)).padStart(3, '0'),   // 001–999
    r: pickRegion()
  };
}
function roundPrice(x) {
  if (x < 10000) return Math.round(x / 100) * 100;
  if (x < 100000) return Math.round(x / 500) * 500;
  return Math.round(x / 1000) * 1000;
}
function fmt(n) { return Math.round(n).toLocaleString('ru-RU') + '\u00a0₽'; }
function fmtMult(m) { return '× ' + String(m).replace('.', ','); }
function plateText(p) { return p.l[0] + p.d + p.l[1] + p.l[2] + ' ' + p.r; }

function evaluate(p) {
  const [a, b, c] = p.l, d = p.d;
  const rows = [{ type:'base', label:'Базовая стоимость', value:BASE }];
  let sum = BASE, ls = 0, ds = 0, dKind = null;
  const add = (label, v) => { rows.push({ type:'add', label, value:v }); sum += v; return v; };

  // --- буквы
  const lTriple = a === b && b === c;
  if (lTriple) ls += add(`Три одинаковые буквы ${p.l}`, TRIPLE_L[a]);
  else if (b === c) ls += add(`Парные буквы ${b}${c}`, 25000);
  else if (a === b) ls += add(`Парные буквы ${a}${b}`, 20000);
  else if (a === c) ls += add(`Одинаковые буквы по краям ${a}…${c}`, 15000);
  const word = WORDS[p.l];
  if (word) ls += add(`Популярная серия «${p.l}»`, word);

  // --- цифры
  const n = d.split('').map(Number);
  let label = null, v = 0;
  if (d[0] === d[1] && d[1] === d[2]) { label = `Три одинаковые цифры ${d}`; v = TRIPLE_D[d[0]]; dKind = 'triple'; }
  else if (SPECIAL_D[d]) { [label, v] = SPECIAL_D[d]; dKind = 'special'; }
  else if (d[0] === '0' && d[1] === '0') { label = `Два нуля в начале ${d}`; v = 130000; }
  else if (d[1] === '0' && d[2] === '0') { label = `Круглое число ${d}`; v = 60000; }
  else if ((n[1]-n[0] === 1 && n[2]-n[1] === 1) || (n[0]-n[1] === 1 && n[1]-n[2] === 1)) { label = `Цифры по порядку ${d}`; v = 40000; }
  else if (d[0] === d[2]) { label = `Зеркальные цифры ${d}`; v = 12000; }
  else if (d[0] === d[1] || d[1] === d[2]) { label = `Парные цифры ${d}`; v = 8000; }
  if (label) ds += add(label, v);

  // --- легенда
  if (p.l === 'ЕКХ' && d === '777') add('Легендарный номер «ЕКХ 777»', 3000000);

  // --- множители
  let mult = 1;
  const g = REGION_MAP[p.r];
  if (g && g.mult > 1) { rows.push({ type:'mult', label:`Регион ${p.r}, ${g.name}`, value:g.mult }); mult *= g.mult; }
  if (dKind === 'triple') {
    const cnt = [...p.r].filter(x => x === d[0]).length;
    if (cnt >= 2) { rows.push({ type:'mult', label:`Цифры ${d[0]}${d[0]} повторяются в регионе`, value:1.5 }); mult *= 1.5; }
  }
  if (lTriple && dKind === 'triple') { rows.push({ type:'mult', label:'Идеальный номер: буквы и цифры', value:3 }); mult *= 3; }
  else if ((lTriple || word) && ds >= 100000) { rows.push({ type:'mult', label:'Сильная связка серии и цифр', value:1.8 }); mult *= 1.8; }
  else if (ls > 0 && ds > 0) { rows.push({ type:'mult', label:'Красиво и в буквах, и в цифрах', value:1.2 }); mult *= 1.2; }

  const price = roundPrice(sum * mult);
  let ti = 0;
  TIERS.forEach((t, i) => { if (price >= t.min) ti = i; });
  return { price, rows, tier:TIERS[ti], tierIdx:ti };
}
// ==== LOGIC END ======================================================

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const retrigger = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const haptic = (kind, style) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](style); } catch (e) {} };

// ---------- sound ----------
let soundOn = true, ac = null;
function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function thump(step, big) {
  if (!soundOn) return;
  try {
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(150 + step * 12 + (big ? 30 : 0), t);
    o.frequency.exponentialRampToValueAtTime(42, t + .13);
    g.gain.setValueAtTime(big ? .7 : .5, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .18);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .2);
    const k = a.createOscillator(), kg = a.createGain();   // металлический щелчок
    k.type = 'square'; k.frequency.value = 1900;
    kg.gain.setValueAtTime(.08, t); kg.gain.exponentialRampToValueAtTime(.001, t + .03);
    k.connect(kg); kg.connect(a.destination); k.start(t); k.stop(t + .04);
  } catch (e) {}
}
function chime(level) {
  if (!soundOn || level < 2) return;
  try {
    const a = audio(), t = a.currentTime;
    [523, 659, 784, 1047].slice(0, level).forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * .09);
      g.gain.linearRampToValueAtTime(.18, t + i * .09 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + i * .09 + .4);
      o.connect(g); g.connect(a.destination); o.start(t + i * .09); o.stop(t + i * .09 + .45);
    });
  } catch (e) {}
}

// ---------- storage ----------
const KEY = 'plates_v1';
let state = { count:0, best:0, items:[] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

function addToGarage(p, price) {
  state.count++;
  state.best = Math.max(state.best, price);
  const txt = plateText(p);
  if (!state.items.some(i => plateText(i) === txt)) state.items.push({ l:p.l, d:p.d, r:p.r });
  state.items = state.items
    .map(i => ({ i, v:evaluate(i).price }))
    .sort((x, y) => y.v - x.v).slice(0, 100).map(x => x.i);
  save(); renderStats();
}

// ---------- rendering ----------
function plateMarkup(p) {
  const rc = p.r.length > 2 ? 'c r3' : 'c';
  return `<div class="plate"><div class="plate-in"><div class="main">
    <span class="c">${p.l[0]}</span><span class="gap"></span>
    <span class="c">${p.d[0]}</span><span class="c">${p.d[1]}</span><span class="c">${p.d[2]}</span>
    <span class="gap"></span><span class="c">${p.l[1]}</span><span class="c">${p.l[2]}</span></div>
    <div class="reg"><span class="${rc}">${p.r}</span><div class="rus"><span>RUS</span><i class="flag"></i></div></div></div></div>`;
}
const slot = $('#slot'), bed = $('#bed');
const resultEl = $('#result'), hintEl = $('#hint'), priceEl = $('#price'), tagsEl = $('#tags'), chipEl = $('#tierChip');
const stampBtn = $('#stampBtn'), shareBtn = $('#shareBtn');
let current = null;   // { p, ev }

slot.innerHTML = plateMarkup({ l:'ААА', d:'000', r:'77' });   // пустая заготовка

function renderStats() {
  $('#stCount').textContent = state.count.toLocaleString('ru-RU');
  $('#stBest').textContent = fmt(state.best);
  $('#garageN').textContent = state.items.length ? `(${state.items.length})` : '';
}

function renderRows(ev) {
  tagsEl.innerHTML = ev.rows.map(r => {
    if (r.type === 'mult') return `<li class="m"><span>${r.label}</span><b>${fmtMult(r.value)}</b></li>`;
    if (r.type === 'add')  return `<li><span>${r.label}</span><b>+ ${fmt(r.value)}</b></li>`;
    return `<li><span>${r.label}</span><b>${fmt(r.value)}</b></li>`;
  }).join('');
  chipEl.textContent = ev.tier.name;
}

function countUp(el, to) {
  if (reduce) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 800;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
  })(t0);
}

function showResult(ev, animate) {
  bed.style.setProperty('--tier', ev.tier.color);
  resultEl.style.setProperty('--tier', ev.tier.color);
  bed.classList.remove('done'); void bed.offsetWidth; bed.classList.add('done');
  hintEl.hidden = true; resultEl.hidden = false;
  renderRows(ev);
  if (animate) countUp(priceEl, ev.price); else priceEl.textContent = fmt(ev.price);
  shareBtn.hidden = false;
}

// ---------- main action ----------
let busy = false;
async function stamp() {
  if (busy) return;
  busy = true; stampBtn.disabled = true; stampBtn.textContent = 'Выбиваю…';
  shareBtn.hidden = true; resultEl.hidden = true; hintEl.hidden = true;
  bed.classList.remove('done');

  const p = randomPlate(), ev = evaluate(p);
  current = { p, ev };
  slot.innerHTML = plateMarkup(p);
  const plate = slot.firstElementChild;
  plate.classList.add('enter');
  await sleep(reduce ? 0 : 380);

  const cs = plate.querySelectorAll('.c');
  for (let i = 0; i < cs.length; i++) {
    const last = i === cs.length - 1;
    cs[i].classList.add('hit');
    if (!reduce) { retrigger(bed, 'shake'); retrigger(plate, 'flash'); }
    thump(i, last);
    haptic('impactOccurred', last ? 'heavy' : 'medium');
    await sleep(reduce ? 30 : (i === cs.length - 2 ? 280 : 150));
  }

  showResult(ev, true);
  chime(ev.tierIdx);
  if (ev.tierIdx >= 2) haptic('notificationOccurred', 'success');
  addToGarage(p, ev.price);
  busy = false; stampBtn.disabled = false; stampBtn.textContent = 'Выбить ещё';
}

function showStatic(p) {
  const ev = evaluate(p);
  current = { p, ev };
  slot.innerHTML = plateMarkup(p);
  slot.querySelectorAll('.c').forEach(c => c.classList.add('on'));
  showResult(ev, false);
  setTab('stamp');
}

function share() {
  if (!current) return;
  const { p, ev } = current;
  const text = `Я выбил номер ${plateText(p)}! Оценка: ${fmt(ev.price)} (${ev.tier.name}). Попробуй выбить свой 👇`;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(BOT_LINK) + '&text=' + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}

// ---------- garage ----------
function renderGarage() {
  const list = $('#garageList');
  if (!state.items.length) {
    list.innerHTML = '<p class="empty">Гараж пуст. Выбей первый номер: здесь остаются 100 самых дорогих.</p>';
    $('#clearBtn').hidden = true; return;
  }
  list.innerHTML = state.items.map((p, i) => {
    const ev = evaluate(p);
    return `<button class="row" data-i="${i}" style="--tier:${ev.tier.color}">${plateMarkup(p)}
      <div><b>${fmt(ev.price)}</b><small>${ev.tier.name}</small></div></button>`;
  }).join('');
  $('#clearBtn').hidden = false;
}
$('#garageList').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) showStatic(state.items[+row.dataset.i]);
});
$('#clearBtn').addEventListener('click', () => {
  const doIt = ok => { if (ok) { state.items = []; save(); renderGarage(); renderStats(); } };
  if (tg && tg.showConfirm) tg.showConfirm('Очистить гараж?', doIt); else doIt(confirm('Очистить гараж?'));
});

// ---------- tabs ----------
function setTab(name) {
  const stampTab = name === 'stamp';
  $('#viewStamp').hidden = !stampTab; $('#viewGarage').hidden = stampTab; $('#bar').hidden = !stampTab;
  $('#tabStamp').setAttribute('aria-selected', stampTab);
  $('#tabGarage').setAttribute('aria-selected', !stampTab);
  if (!stampTab) renderGarage();
}
$('#tabStamp').onclick = () => setTab('stamp');
$('#tabGarage').onclick = () => setTab('garage');

stampBtn.onclick = stamp;
shareBtn.onclick = share;
$('#soundBtn').onclick = e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
  e.currentTarget.setAttribute('aria-label', soundOn ? 'Звук включён' : 'Звук выключен');
};

renderStats();
})();
</script>
</body>
</html>
